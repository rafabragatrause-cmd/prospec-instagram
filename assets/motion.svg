<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Fluxo: busca, perfis, agente escreve, envio com teto, inbox, call marcada">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".65" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <clipPath id="c"><rect width="1280" height="340" rx="22"/></clipPath>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .fill{transform-origin:120px 180px;animation:fill 12s linear infinite}
      @keyframes fill{0%{transform:scaleX(0)}83%,100%{transform:scaleX(1)}}
      .run{animation:run 12s linear infinite}
      @keyframes run{0%{transform:translateX(0)}83%,100%{transform:translateX(1040px)}}
      .s{animation:lit 12s infinite backwards}
      .s1{animation-delay:0s}.s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}.s5{animation-delay:8s}.s6{animation-delay:10s}
      @keyframes lit{0%{opacity:.3}4%,90%{opacity:1}100%{opacity:.3}}
      .k{opacity:0;animation:k 12s infinite backwards}
      .k1{animation-delay:6.3s}.k2{animation-delay:7.1s}.k3{animation-delay:7.9s}
      @keyframes k{0%{opacity:0}2%,30%{opacity:1}36%,100%{opacity:0}}
      .done{opacity:0;animation:done 12s infinite}
      @keyframes done{0%,82%{opacity:0;transform:scale(.9)}86%,97%{opacity:1;transform:scale(1)}100%{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1280" height="340" fill="#0d0b12"/>
    <text x="64" y="58" class="m" font-size="14" letter-spacing="3" fill="#f2a4c4">COMO RODA</text>
    <text x="64" y="92" class="t" font-size="28" font-weight="700" fill="#fff">Do perfil achado à call marcada</text>

    <rect x="120" y="178" width="1040" height="4" rx="2" fill="#2a2433"/>
    <rect class="fill" x="120" y="178" width="1040" height="4" rx="2" fill="url(#g)"/>
    <g class="run"><circle cx="120" cy="180" r="9" fill="#fff"/><circle cx="120" cy="180" r="18" fill="#d62976" opacity=".3"/></g>

    <g><circle cx="120" cy="180" r="31" fill="#0d0b12"/><circle cx="328" cy="180" r="31" fill="#0d0b12"/><circle cx="536" cy="180" r="31" fill="#0d0b12"/><circle cx="744" cy="180" r="31" fill="#0d0b12"/><circle cx="952" cy="180" r="31" fill="#0d0b12"/><circle cx="1160" cy="180" r="31" fill="#0d0b12"/></g>
    <g class="t" text-anchor="middle">
      <g class="s s1"><circle cx="120" cy="180" r="30" fill="#16131d" stroke="url(#g)" stroke-width="2"/><text x="120" y="187" class="m" font-size="18" fill="#fff">01</text>
        <text x="120" y="240" font-size="17" font-weight="700" fill="#fff">Busca</text><text x="120" y="262" font-size="13" fill="#8f879e">nicho × cidade</text></g>
      <g class="s s2"><circle cx="328" cy="180" r="30" fill="#16131d" stroke="url(#g)" stroke-width="2"/><text x="328" y="187" class="m" font-size="18" fill="#fff">02</text>
        <text x="328" y="240" font-size="17" font-weight="700" fill="#fff">Perfis</text><text x="328" y="262" font-size="13" fill="#8f879e">bio, seguidores, link</text></g>
      <g class="s s3"><circle cx="536" cy="180" r="30" fill="#16131d" stroke="url(#g)" stroke-width="2"/><text x="536" y="187" class="m" font-size="18" fill="#fff">03</text>
        <text x="536" y="240" font-size="17" font-weight="700" fill="#fff">Agente escreve</text><text x="536" y="262" font-size="13" fill="#8f879e">Codex ou Claude Code</text></g>
      <g class="s s4"><circle cx="744" cy="180" r="30" fill="#16131d" stroke="url(#g)" stroke-width="2"/><text x="744" y="187" class="m" font-size="18" fill="#fff">04</text>
        <text x="744" y="240" font-size="17" font-weight="700" fill="#fff">Envio</text><text x="744" y="262" font-size="13" fill="#8f879e">teto/dia, 8–15 min</text></g>
      <g class="s s5"><circle cx="952" cy="180" r="30" fill="#16131d" stroke="url(#g)" stroke-width="2"/><text x="952" y="187" class="m" font-size="18" fill="#fff">05</text>
        <text x="952" y="240" font-size="17" font-weight="700" fill="#fff">Inbox</text><text x="952" y="262" font-size="13" fill="#8f879e">quem respondeu</text></g>
      <g class="s s6"><circle cx="1160" cy="180" r="30" fill="#16131d" stroke="url(#g)" stroke-width="2"/><text x="1160" y="187" class="m" font-size="18" fill="#fff">06</text>
        <text x="1160" y="240" font-size="17" font-weight="700" fill="#fff">Call</text><text x="1160" y="262" font-size="13" fill="#8f879e">valor só na conversa</text></g>
    </g>

    <g class="m" font-size="13" fill="#cfc8db">
      <text class="k k1" x="744" y="134" text-anchor="middle">@clinica.exemplo → ok</text>
      <text class="k k2" x="744" y="134" text-anchor="middle">@studio.exemplo → ok</text>
      <text class="k k3" x="744" y="134" text-anchor="middle">@odonto.exemplo → ok</text>
    </g>
    <g class="done" style="transform-origin:1160px 300px">
      <rect x="1062" y="286" width="196" height="32" rx="16" fill="url(#g)"/>
      <text x="1160" y="307" class="t" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">call marcada</text>
    </g>
    <text x="64" y="316" class="m" font-size="12" fill="#5d566a">bloqueio do Instagram = para tudo · opt-out = nunca mais</text>
  </g>
</svg>
